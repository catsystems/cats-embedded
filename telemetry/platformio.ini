[env:telemetry]

platform = platformio/ststm32@20.0.0
platform_packages =
  platformio/toolchain-gccarmnoneeabi@1.140201.0
  platformio/framework-stm32cubeg0@1.6.3
  platformio/tool-ldscripts-ststm32@0.3.0
  platformio/tool-scons@4.40801.0
board = disco_g071rb
framework = stm32cube

extra_scripts =
    pre:pre_config.py

build_flags =
  -D FIRMWARE_VERSION='"1.2.0"'

check_tool = clangtidy
check_src_filters =
  +<lib/>
  -<lib/TinyGps>
  -<lib/Sx1280Driver>
  +<src/>
  -<src/st>
check_flags =
  clangtidy: --config-file=../.clang-tidy
